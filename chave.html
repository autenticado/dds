<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagamento via PIX</title>
<style>body{font-family:Arial,sans-serif;background:#f2f7ff;color:#25364d;margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;padding:18px;box-sizing:border-box}main{max-width:430px;background:#fff;border-radius:20px;padding:30px 22px;box-shadow:0 12px 35px #1c5a991c}p{line-height:1.5}#erro{color:#a32a2a}</style></head><body><main><h2>Pagamento via PIX</h2><p id="status">Abrindo pagamento seguro...</p><p id="erro" hidden>Link de pagamento inválido. Solicite um novo link ao atendente.</p></main>
<script>
(function(){
const params=new URLSearchParams(location.search),id=params.get('p')||'',api=params.get('api')||'';
let url;try{url=new URL(api)}catch(e){}
const valido=/^[a-f0-9]{64}$/i.test(id)&&url&&url.protocol==='https:'&&url.hostname==='script.google.com'&&/^\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url.pathname)&&!url.search&&!url.hash;
if(!valido){document.getElementById('status').hidden=true;document.getElementById('erro').hidden=false;return}
url.searchParams.set('p',id);location.replace(url.href);
})();
</script></body></html>
