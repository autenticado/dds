<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pagamento via Pix</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#eef6f7;color:#183a42;font-family:Arial,sans-serif}
main{width:min(100%,480px);padding:28px 22px;background:white;border-radius:16px;text-align:center;box-shadow:0 8px 26px #1b4c591a}
h1{font-size:22px;margin:0 0 12px}p{font-size:14px;line-height:1.5;color:#57717a}
#erro{color:#a32a2a;display:none}
a{color:#145ca8}
</style>
</head>
<body>
<main>
<h1>Pagamento via Pix</h1>
<p id="carregando">Abrindo os detalhes do pagamento...</p>
<p id="erro">Link de pagamento inválido ou incompleto. Solicite um novo link ao atendente.</p>
</main>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  const id=params.get('p')||'';
  const api=params.get('api')||'';
  const validId=/^[a-f0-9]{64}$/i.test(id);
  let url=null;
  try{url=new URL(api);}catch(e){}
  const validApi=url && url.protocol==='https:' && url.hostname==='script.google.com'
    && /^\/macros\/s\/[A-Za-z0-9_-]+\/(exec|dev)$/.test(url.pathname)
    && !url.search && !url.hash;
  if(!validId||!validApi){
    document.getElementById('carregando').style.display='none';
    document.getElementById('erro').style.display='block';
    return;
  }
  url.searchParams.set('p',id);
  location.replace(url.href);
})();
</script>
</body>
</html>
