<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pagamento via Pix</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#eef6f7;font-family:Arial,sans-serif;color:#183a42;display:flex;align-items:center;justify-content:center}
main{width:min(100%,600px);padding:24px 16px;text-align:center}
h1{font-size:23px;margin:8px 0 12px}
p{color:#57717a;font-size:14px;line-height:1.5}
#erro{display:none;color:#a32a2a;background:#fff;padding:24px 18px;border-radius:16px}
#aguarde{display:none}
</style>
</head>
<body>
<main>
<h1>Pagamento via Pix</h1>
<p id="aguarde">Abrindo a página completa do seu pagamento...</p>
<div id="erro" role="alert">Link de pagamento inválido ou incompleto. Solicite um novo link ao atendente.</div>
</main>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  const id=params.get('p')||'';
  const api=params.get('api')||'';
  const validId=/^[a-f0-9]{64}$/i.test(id);
  let url=null;
  try{url=new URL(api);}catch(e){}
  const validApi=url && url.protocol==='https:' && url.hostname==='script.google.com'
    && /^\/macros\/s\/[A-Za-z0-9_-]+\/(exec|dev)$/.test(url.pathname)
    && !url.search && !url.hash;
  if(!validId||!validApi){
    document.getElementById('erro').style.display='block';
    return;
  }
  url.searchParams.set('p',id);
  document.getElementById('aguarde').style.display='block';
  location.replace(url.href);
})();
</script>
</body>
</html>
